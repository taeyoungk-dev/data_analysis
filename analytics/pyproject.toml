[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-insight-analytics"
version = "1.0.0"
description = "Reproducible regional health-access and housing-market analytics pipeline"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
regional-insight = "regional_insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

