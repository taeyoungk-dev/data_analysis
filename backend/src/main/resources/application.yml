spring:
  application:
    name: regional-insight-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/regional_insight}
    username: ${DB_USERNAME:regional}
    password: ${DB_PASSWORD:regional-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Cache failures fall back to the database (see CacheConfig), so fail fast instead of
      # holding the request open when Redis is unavailable.
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false
  web:
    resources:
      cache:
        # Static assets are revalidated with Last-Modified (cheap 304s) so a redeploy is picked
        # up immediately without relying on manual cache-busting query strings.
        cachecontrol:
          no-cache: true

server:
  port: ${PORT:8085}
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # Metrics reveal internal runtime details and have no authentication in front of them.
        # Opt in per environment, e.g. MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

info:
  app:
    name: Regional Insight Korea
    version: 1.1.0

---
spring:
  config:
    activate:
      on-profile: local,test
  datasource:
    url: jdbc:h2:mem:regional-insight;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false
  h2:
    console:
      enabled: true

management:
  health:
    redis:
      enabled: false
