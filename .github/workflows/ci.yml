name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: analytics/pyproject.toml
      - run: python -m pip install -e './analytics[dev]'
      - run: ruff check analytics
      - run: pytest analytics/tests
      - run: python -m regional_insight.cli build
      - run: git diff --exit-code -- analytics/data/processed backend/src/main/resources/db/migration/V2__seed_analytics.sql

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: backend
        run: ./gradlew test --no-daemon
